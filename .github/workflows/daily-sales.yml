name: Daily Sales Update Bot

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Restore WhatsApp Session
        run: |
          mkdir -p auth_info
          echo "${{ secrets.WA_SESSION_BASE64 }}" | tr -d ' \r\n' | base64 --decode > auth.zip
          unzip -o auth.zip -d auth_info || true
          if [ -d "auth_info/auth_info" ]; then
            mv auth_info/auth_info/* auth_info/
            rm -rf auth_info/auth_info
          fi
          ls -la auth_info

      - name: Run Sales Bot
        env:
          HARDWARE_API_TOKEN: ${{ secrets.HARDWARE_API_TOKEN }}
          HARDWARE_COMPANY_DOMAIN: ${{ secrets.HARDWARE_COMPANY_DOMAIN }}
          GATE_API_TOKEN: ${{ secrets.GATE_API_TOKEN }}
          GATE_COMPANY_DOMAIN: ${{ secrets.GATE_COMPANY_DOMAIN }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
        run: node index.js
